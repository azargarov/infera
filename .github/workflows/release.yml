name: Release verification

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Install release dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run release-tree public checks
        run: |
          python validation/check_public_boundary.py
          git diff --check
          test "$(git ls-files | grep -Ec '(^|/)(overlay\\.qcow2|seed\\.iso|id_ed25519(\\.pub)?|known_hosts|serial\\.log)$' || true)" -eq 0

      - name: Generate release manifest
        run: |
          python validation/create_release_manifest.py --version "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --output dist/release-manifest.yaml
          sha256sum dist/release-manifest.yaml > dist/release-manifest.sha256

      - name: Upload release manifest artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: infera-${{ github.ref_name }}-manifest
          path: dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "Infera $GITHUB_REF_NAME" --generate-notes dist/release-manifest.yaml dist/release-manifest.sha256
