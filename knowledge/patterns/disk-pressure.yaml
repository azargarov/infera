content:
  signal: high usage on an affected mount
  possible_effect: application writes may fail
  useful_checks:
    - identify the affected mount
    - compare usage with application errors
    - inspect ownership and retention before proposing cleanup
  interpretation: high usage does not establish that every filesystem is affected
