$schema: https://json-schema.org/draft/2020-12/schema
$id: https://example.invalid/infera/schemas/report.schema.yaml
title: Infera structured report
type: object
additionalProperties: false
required:
  - schema_version
  - report_id
  - run_id
  - scenario_id
  - target
  - collection_window
  - overall_status
  - finding_ids
  - evidence_ids
  - known_unknowns
  - safe_next_actions
  - action_refs
  - validation_status
  - artifact_links
properties:
  schema_version: {type: string, const: report/v1}
  report_id: {type: string, minLength: 1}
  run_id: {type: string, minLength: 1}
  scenario_id: {type: string, minLength: 1}
  target: {type: string, minLength: 1}
  collection_window:
    type: object
    required: [start, end]
    properties:
      start: {type: string, minLength: 1}
      end: {type: string, minLength: 1}
  overall_status: {type: string, minLength: 1}
  finding_ids:
    type: array
    items: {type: string, minLength: 1}
  evidence_ids:
    type: array
    items: {type: string, minLength: 1}
  known_unknowns:
    type: array
    items: {type: string, minLength: 1}
  safe_next_actions:
    type: array
    items: {type: string, minLength: 1}
  action_refs:
    type: array
    items:
      type: object
      required: [action_id, status]
      properties:
        action_id: {type: string, minLength: 1}
        status: {type: string, minLength: 1}
  validation_status:
    type: string
    enum: [pending, passed, failed]
  artifact_links:
    type: object
